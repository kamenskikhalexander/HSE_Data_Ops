replicaCount: 1

postgres:
  image:
    repository: postgres
    tag: "15"
    pullPolicy: IfNotPresent
  database: ml_service
  user: postgres
  password: postgres
  service:
    type: ClusterIP
    port: 5432
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

mlService:
  image:
    repository: ml-service
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8000
    nodePort: 30080
  databaseUrl: postgresql://postgres:postgres@postgres:5432/ml_service
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

prometheus:
  image:
    repository: prom/prometheus
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 9090
    nodePort: 30090
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

grafana:
  image:
    repository: grafana/grafana
    tag: "latest"
    pullPolicy: IfNotPresent
  adminUser: admin
  adminPassword: admin
  service:
    type: NodePort
    port: 3000
    nodePort: 30300
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

ingress:
  enabled: true
  host: localhost
  paths:
    mlService: /ml-service
    prometheus: /prometheus
    grafana: /grafana
